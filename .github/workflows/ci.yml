name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'

      - name: Build and run tests
        env:
          USERS: Tanvir:ci-only-pw-1,Andre:ci-only-pw-2,Tahsin:ci-only-pw-3,Shaif:ci-only-pw-4
        run: mvn test

      - name: Build Docker image
        run: docker build -t questshaper-server .